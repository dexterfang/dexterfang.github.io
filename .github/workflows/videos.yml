name: Refresh latest videos
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 scripts/fetch_videos.py
      - name: Commit if changed
        run: |
          git config user.name "video-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/videos.json assets/yt
          git diff --cached --quiet || git commit -m "Refresh latest videos" && git push
